name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # weekly, so a newly published rule finds existing code rather than waiting
    # for the next commit to touch it
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    # Code scanning needs GitHub Advanced Security, which a private repository
    # does not have. The analysis itself runs fine there; only the upload fails,
    # so the job would sit red for a reason that says nothing about the code.
    # Gated rather than deleted, so it starts working the moment this is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          # basalt parses text from external tools and reads ELF from disk, so
          # the injection and path-handling rules are the ones that matter here
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
