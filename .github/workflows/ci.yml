name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # the ISA drift check is the slow job and does not need to gate a push; a
    # nightly run catches a compiler update within a day, which is soon enough
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs everywhere, main included.
  #
  # This used to exempt main, on the reasoning that a cancelled run leaves the
  # branch with no recorded status. That is not what the setting does. With
  # cancel-in-progress false GitHub still holds only one pending run per group,
  # so a third push cancels the queued one regardless: five of the eight main
  # runs before this change ended up cancelled anyway. The exemption bought no
  # extra status and cost a full corpus run per superseded commit.
  cancel-in-progress: true

env:
  CUDA_VERSION: "13.3.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # the same pinned ruff and mypy the dev extra and pre-commit use, so the
      # gate cannot move under a contributor between their machine and here
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # a checker whose own types are unchecked is a poor advertisement for one.
      # both platforms from the one runner, because the driver loads a different
      # library on each and only the host's branch would otherwise be looked at:
      # `ctypes.WinDLL` does not exist on Linux and this is where that shows up
      - run: mypy --platform linux
      - run: mypy --platform win32

  unit:
    # the pure unit tests touch no NVIDIA binary, so they run everywhere and
    # stay the fast signal on every push
    strategy:
      fail-fast: false
      matrix:
        # linux only, on purpose. development happens on Windows, so every local
        # pytest run is already the Windows leg; what never gets exercised there
        # is Linux, and that is the gap CI is here to close. the two places the
        # platforms actually diverge are still covered: `mypy --platform win32`
        # in the lint job checks the `os.name == "nt"` branch in toolchain
        # discovery and the driver's WinDLL branch, without booting a runner.
        os: [ubuntu-latest]
        # none of these are the interpreter used locally, which is the point
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -m "not toolchain and not gpu and not slow"

  oracles:
    # needs ptxas and nvdisasm but no GPU, which is the whole reason the
    # instruction database and the checker are reproducible by anyone.
    #
    # Not on pushes. Every step here needs the NVIDIA toolchain fetched and
    # unpacked, and every one of them is something scripts/verify_all.py runs
    # locally before the push happens. Downloading a redistributable per commit
    # to re-answer a question already answered on the machine that made the
    # commit is the definition of a redundant job. Pull requests and the nightly
    # run still do all of it, which is where an outside reader looks anyway.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Cache the pinned CUDA redistributables
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/cuda/_archives
          key: cuda-redist-${{ env.CUDA_VERSION }}-${{ hashFiles('scripts/fetch_toolchain.py') }}

      - name: Fetch the pinned toolchain
        run: |
          python scripts/fetch_toolchain.py
          echo "BASALT_CUDA_BIN=$PWD/third_party/cuda/$CUDA_VERSION/bin" >> "$GITHUB_ENV"

      - name: Verify both oracles
        run: python -m basalt.cli doctor

      - name: Run the toolchain-marked tests
        run: pytest -m "toolchain and not slow"

      - name: Positive control over the whole corpus
        # every kernel ptxas builds must verify clean, at all three -O levels.
        # this is the check that decides whether anything else basalt reports
        # is worth reading, and it is also 693 of this job's 844 seconds: 449
        # kernels compiled and disassembled three times over. measured, the
        # cost is nvdisasm, 441 spawns a level at ~36 ms each; the hazard
        # analysis those spawns feed is 2.1 s for all 1347.
        #
        # it runs on pull requests and nightly rather than on every push. the
        # same sweep runs locally through scripts/verify_all.py before a push,
        # so re-running it per commit buys a second opinion from an identical
        # pinned toolchain and costs twelve minutes to do it. `isa-drift` below
        # is gated the same way for the same reason.
        run: pytest -m slow

      - name: Try to make the assembler emit something else
        # the coverage run only asks about text ptxas chose to emit. this goes
        # looking, and it found four real defects the corpus never reached
        run: |
          for seed in 1 2 3; do
            python scripts/fuzz_assembler.py --cases 60 --seed "$seed"
          done

      - name: Reproduce the assembler number the README quotes
        # the suite already pins "nothing assembles to the wrong bytes"; this
        # prints the figure itself, so a drop in coverage is visible in the log
        # rather than only when it crosses the floor, and the script that
        # produces the published number cannot quietly stop working.
        #
        # correctness is therefore already gated above. this is a reporting
        # pass that recompiles all 449 kernels a fourth time for about a
        # hundred seconds, so it belongs on the nightly run, not on every push.
        run: python scripts/assembler_coverage.py

  isa-drift:
    # Rebuilding the database takes minutes and answers a different question:
    # has the compiler changed what it emits. That does not need to gate a push,
    # so it runs on pull requests and nightly instead of on every commit.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Cache the pinned CUDA redistributables
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/cuda/_archives
          key: cuda-redist-${{ env.CUDA_VERSION }}-${{ hashFiles('scripts/fetch_toolchain.py') }}

      - name: Fetch the pinned toolchain
        run: |
          python scripts/fetch_toolchain.py
          echo "BASALT_CUDA_BIN=$PWD/third_party/cuda/$CUDA_VERSION/bin" >> "$GITHUB_ENV"

      - name: Rebuild the ISA database and compare it with the committed copy
        # the database is generated data that is nonetheless committed, so that
        # a consumer needs no harvest. that trade only works if drift is loud.
        run: |
          python -m basalt.cli build-isa -o /tmp/rebuilt.json
          python scripts/compare_isa.py src/basalt/data/isa/sm_120a.json /tmp/rebuilt.json

      - name: Check the measured fields still behave
        run: python -m basalt.cli validate-isa --show
