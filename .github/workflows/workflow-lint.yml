#
# Lints the CI itself. The rest of this repository refuses to take a claim
# without evidence produced by something other than the thing making it, and
# the workflows are the thing making most of the claims: that the corpus
# verified, that the ISA did not drift, that a release came from this source.
# A workflow nobody checks is an oracle nobody checked.
#
# Two tools, two questions. actionlint asks whether the workflow is correct
# (bad expressions, undefined matrix keys, shell mistakes). zizmor asks whether
# it is safe (template injection, credential persistence, unpinned actions,
# cache poisoning) and annotates what it finds on the diff, where a regression
# is visible without anyone remembering to look.
#
# Both run in pre-commit too, at the same severity gate, so the answer does not
# change between a laptop and a runner.
name: workflow-lint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the workflows are correct
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # shellcheck via actionlint re-reports quoting style that ruff and
          # shfmt already own; keep this gate about workflow correctness
          flags: "-ignore SC2086 -ignore SC2129"

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the workflows are safe
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # medium and up fails the build; low and informational stay visible
          # locally without turning every run into noise to be ignored
          min-severity: medium
          # annotations rather than the security tab: uploading SARIF needs code
          # scanning enabled, and a lint that fails on a setting nobody turned
          # on reports the setting rather than the workflows
          advanced-security: false
          annotations: true
