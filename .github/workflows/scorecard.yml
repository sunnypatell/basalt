#
# OpenSSF Scorecard: an outside assessment of this repository's supply-chain
# posture, published rather than self-reported.
#
# The reasoning is the same one the rest of the project runs on. basalt's
# argument is that a claim needs evidence produced by something other than the
# thing making the claim, and "this repository is maintained responsibly" is a
# claim like any other. The results land in the security tab, and a regression
# shows up there without anyone remembering to look.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard reads the repository through the public API and publishes to a
    # public dataset, so on a private repository it fails on every check rather
    # than reporting one. Skipped until the repository is public.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # publishing makes the result checkable by anyone rather than only by
          # the maintainer, which is the whole point of running it
          publish_results: true

      # only reached on a public repository, where code scanning is available
      - name: Upload to the security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        continue-on-error: true
        with:
          sarif_file: results.sarif
