[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basalt-sass"
version = "1.0.0"
description = "The check NVIDIA never shipped: an assembler, hazard checker and scheduler for consumer Blackwell (sm_120), matched to ptxas byte for byte."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sunny Patel", email = "sunnypatel124555@gmail.com" }]
keywords = [
  "cuda", "sass", "assembler", "blackwell", "sm120", "gpu",
  "reverse-engineering", "ptx", "nvidia", "disassembler", "isa",
]
# no license classifier here: PEP 639 supersedes them with the `license`
# expression above, and setuptools rejects a project that carries both
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Assemblers",
  "Topic :: Software Development :: Disassemblers",
]
# the pipeline shells out to ptxas and nvdisasm and parses text. that is a
# deliberate constraint: no third-party runtime dependency means the ISA
# database can be rebuilt from a pinned redistributable and nothing else.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  # the lint gate is pinned, not floored. a floating ruff or mypy changes what
  # CI rejects without anyone making a commit, and a contributor goes red on
  # code they did not touch. these two track .pre-commit-config.yaml exactly,
  # so the local hook and the runner cannot disagree; dependabot moves both.
  "ruff==0.16.4",
  "mypy==2.3.1",
]

[project.urls]
Homepage = "https://github.com/sunnypatell/basalt"
Repository = "https://github.com/sunnypatell/basalt"
Issues = "https://github.com/sunnypatell/basalt/issues"

[project.scripts]
basalt = "basalt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the measured tables ship with the package: without them the checker falls back
# to assumed numbers and reports findings it cannot ground
basalt = ["py.typed", "data/isa/*.json", "data/latency/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the working tree wins over whatever is installed, so a stale editable install
# elsewhere on the machine cannot quietly be the thing under test
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "toolchain: needs ptxas and nvdisasm on the machine",
  "gpu: needs a physical sm_120 device",
  "slow: takes minutes; the full-corpus control lives here",
]

[tool.mypy]
python_version = "3.11"
files = ["src/basalt"]
# ctypes-heavy driver code and the NVIDIA binaries have no stubs to find
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
